name: 每日新闻简报

on:
  schedule:
    # GitHub Actions 的 cron 一律按 UTC 计算。
    # 北京时间 07:30 = 前一日 UTC 23:30，故写作 30 23 * * *
    # 刻意避开整点与 UTC 0 点高峰，减少排队延迟。
    - cron: '30 23 * * *'
  workflow_dispatch:   # 保留手动触发，用于首次测试与仓库保活

permissions:
  contents: write      # 需要把 state.json 回写仓库

concurrency:
  group: daily-brief
  cancel-in-progress: false   # 不允许并发运行，避免两个任务同时写 state.json

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成并推送简报
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: python daily_brief.py

      - name: 回写状态文件
        if: always()      # 即使推送失败也要提交待补队列，否则下次会漏发
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新简报状态 [skip ci]"
            git push
          fi
